# Weekly updates, grouped so each ecosystem opens one pull request a week at
# most; a major npm version gets its own. Actions and base images are pinned
# by digest, which Dependabot moves along with their version comments.
# A release is proposed a week after it came out: a compromised one is
# usually pulled by then. Security updates don't wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]
    # A new Node major is a deliberate move, made by hand once it is LTS:
    # Node 25+ drops corepack, which the Dockerfile enables.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # The runtime base follows the Alpine minor that caddy:2-alpine is
      # built on (ADR 033), moved by hand when the official image moves.
      - dependency-name: alpine
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e-servers:
        patterns: ["*"]
