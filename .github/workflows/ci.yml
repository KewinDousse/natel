name: CI

# Actions minutes are counted: a draft pull request runs nothing (its author
# runs the checks locally), and a push to main, whose pull request already
# passed, runs only the unit checks, and the image when it changed (against
# the previous push, so a cancelled run's changes wait for the next tag).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The English guide is bundled into the app.
    paths: ["**", "!**/*.md", "!docs/**", "docs/user-guide.md"]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    # The RUNNER repository variable moves the jobs that run on this repository
    # to a self-hosted runner; publish and demo run only on KewinDousse/natel.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # A self-hosted runner is slower than GitHub's.
    timeout-minutes: ${{ vars.RUNNER && 45 || 15 }}
    outputs:
      image: ${{ steps.image.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its base, for the diff below.
          fetch-depth: 2
      # A pull request or a push to main tests the image only when it changes
      # what the image adds around the app: Caddy, the build, the /dav proxy.
      # The e2e suite already runs under the Caddyfile's CSP (vite.config.ts).
      - id: image
        env:
          BASE: ${{ (github.event_name == 'pull_request' && 'HEAD^1') || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: |
          if [ -z "$BASE" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git cat-file -e "$BASE" 2>/dev/null || git fetch --quiet --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(Dockerfile|Caddyfile|\.dockerignore|package\.json|pnpm-(lock|workspace)\.yaml|vite\.config\.ts|playwright\.config\.ts|session/|src/dav/|tests/e2e/|\.github/workflows/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # natel-session (ADR 032), with the Go image the Dockerfile builds it in.
      - run: |
          image=$(sed -n 's/^FROM --platform=$BUILDPLATFORM \(golang:[^ ]*\) AS session$/\1/p' Dockerfile)
          test -n "$image"
          docker run --rm -v "$PWD/session:/src" -w /src "$image" \
            sh -c 'test -z "$(gofmt -l .)" && go vet ./... && go test ./...'
      - run: pnpm build
      # The demo's CardDAV stand-in (ADR 025) never ships in the image's build.
      - run: |
          if grep -rq demo.natel.invalid dist; then
            echo "The demo's CardDAV stand-in is in the normal build" >&2
            exit 1
          fi
      # Nor does the demo's preview image, which names the demo's address.
      - run: |
          if grep -rqE 'og:image|og-image\.png|github\.io' dist; then
            echo "The demo's link preview image is in the normal build" >&2
            exit 1
          fi

  e2e:
    name: e2e (${{ matrix.server }})
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.RUNNER && 45 || 15 }}
    # The compatibility matrix: the same suite against each CardDAV server.
    strategy:
      fail-fast: false
      matrix:
        server: [radicale, baikal, xandikos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
        env:
          E2E_SERVER: ${{ matrix.server }}
      # The demo build (ADR 025) needs no server: once is enough.
      - if: matrix.server == 'radicale'
        run: pnpm e2e:demo
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.server }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # A tag publishes only what passed the other jobs.
    needs: [check, e2e]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success'
      && (needs.e2e.result == 'success'
      || (needs.e2e.result == 'skipped' && !startsWith(github.ref, 'refs/tags/')))
      && needs.check.outputs.image == 'true' }}
    # Pinned rather than -latest: both jobs rely on the image's skopeo.
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ vars.RUNNER && 60 || 20 }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    # A tag builds what gets published: it reads no cache, since a run of
    # main can write to the ones it would read.
    env:
      TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          # A multi-platform package takes its description from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/kewindousse/natel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Both platforms in one OCI archive, so the amd64 image tested below is
      # the one published. The build stage runs natively (see the Dockerfile):
      # arm64 needs no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: NATEL_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=image.tar
          provenance: false
          tags: natel:ci
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          no-cache: ${{ env.TAG_BUILD }}
          cache-from: ${{ env.TAG_BUILD != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.TAG_BUILD != 'true' && 'type=gha,mode=max' || '' }}
      - run: >
          skopeo copy --override-os linux --override-arch amd64
          oci-archive:image.tar:ci docker-daemon:natel:ci
      # The e2e suite again, this time through the image's Caddy: its /dav
      # proxy, redirect mapping and dropped WWW-Authenticate are what users run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ env.TAG_BUILD != 'true' && 'pnpm' || '' }}
          package-manager-cache: ${{ env.TAG_BUILD != 'true' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ${{ env.TAG_BUILD != 'true' && 'pip' || '' }}
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Locked down as a cautious user would run it: no capability, no new
      # privileges, a read-only filesystem.
      - run: >
          docker run -d --name natel --network host
          --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /config
          -e CARDDAV_URL=http://127.0.0.1:5299 -e SITE_ADDRESS=:4299 natel:ci
      - run: curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4299/
      - run: pnpm e2e
        env:
          E2E_EXTERNAL_APP: "1"
      - if: failure()
        run: docker logs natel
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-image
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Hand the tested archive itself to the publish job, not a rebuild.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    # The only job allowed to write packages, and it runs no repository code.
    # Only this repository publishes the image; a copy of it doesn't.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'KewinDousse/natel'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      # Signs the provenance attestation and stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --all keeps both platforms under each tag. Every tag gets the same
      # index, whose digest the attestation below names.
      - id: push
        run: |
          test -n "$TAGS"
          for tag in $TAGS; do
            skopeo copy --all --digestfile digest oci-archive:image.tar:ci "docker://$tag"
          done
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
        env:
          TAGS: ${{ needs.image.outputs.tags }}
      # Lets users check the image came from this workflow:
      # gh attestation verify oci://ghcr.io/kewindousse/natel:<tag> --owner KewinDousse
      # GitHub attests only for public repositories on this plan.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kewindousse/natel
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  demo:
    # The demo (ADR 025) on this repository's GitHub Pages site, at
    # demo.natel.app, at each release; a pre-release (a tag with a suffix)
    # leaves it as it is.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
      && github.repository == 'KewinDousse/natel'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time, so two tags close together land in order.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No cache: this job runs on tags only, and publishes what it builds
      # (see the image job).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --outDir dist-demo
        env:
          NATEL_REVISION: ${{ github.sha }}
          VITE_DEMO: "1"
          DEMO_URL: https://demo.natel.app/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-demo
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
