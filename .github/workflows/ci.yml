name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    name: e2e (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The compatibility matrix: the same suite against each CardDAV server.
    strategy:
      fail-fast: false
      matrix:
        server: [radicale, baikal, xandikos]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_SERVER: ${{ matrix.server }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.server }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # A tag publishes only what passed the other jobs.
    needs: [check, e2e]
    # Pinned rather than -latest: both jobs rely on the image's skopeo.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        env:
          # A multi-platform package takes its description from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/kewindousse/natel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Both platforms in one OCI archive, so the amd64 image tested below is
      # the one published. The build stage runs natively (see the Dockerfile):
      # arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=image.tar
          provenance: false
          tags: natel:ci
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >
          skopeo copy --override-os linux --override-arch amd64
          oci-archive:image.tar:ci docker-daemon:natel:ci
      # The e2e suite again, this time through the image's Caddy: its /dav
      # proxy, redirect mapping and dropped WWW-Authenticate are what users run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: >
          docker run -d --name natel --network host
          -e BAIKAL_URL=http://127.0.0.1:5299 -e SITE_ADDRESS=:4299 natel:ci
      - run: curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4299/
      - run: pnpm e2e
        env:
          E2E_EXTERNAL_APP: "1"
      - if: failure()
        run: docker logs natel
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-image
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Hand the tested archive itself to the publish job, not a rebuild.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    # The only job allowed to write packages, and it runs no repository code.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --all keeps both platforms under each tag.
      - run: |
          test -n "$TAGS"
          for tag in $TAGS; do
            skopeo copy --all oci-archive:image.tar:ci "docker://$tag"
          done
        env:
          TAGS: ${{ needs.image.outputs.tags }}
