name: CI

# Actions minutes are counted: a draft pull request runs nothing (its author
# runs the checks locally), one that changes only documentation and change
# notes skips the tests, and a push to main, whose pull request already
# passed, runs only the unit checks, and the image when it changed (against
# the previous push, so a cancelled run's changes wait for the next tag).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:
    outputs:
      image_artifact:
        description: Artifact containing the exact tested image
        value: ${{ jobs.image.outputs.artifact }}
    inputs:
      candidate_sha:
        type: string
        default: ""
      candidate_artifact:
        type: string
        default: ""
      release_version:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ inputs.candidate_sha && format('release-tests-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.candidate_sha == '' }}

jobs:
  # Every pull request runs this workflow, so its required checks always
  # report, even when their tests are skipped.
  changes:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # The app bundles the English guide, and the demo build reads its link
      # preview image from docs/brand. A move counts its old path too.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if printf '%s\n' "$files" | grep -qvE '^(docs|\.changes)/|\.md$' ||
            printf '%s\n' "$files" | grep -qE '^docs/(user-guide\.md$|brand/)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    # The RUNNER repository variable moves the jobs that run on this repository
    # to a self-hosted runner; publish and demo run only on KewinDousse/natel.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # A self-hosted runner is slower than GitHub's.
    timeout-minutes: ${{ vars.RUNNER && 45 || 15 }}
    outputs:
      image: ${{ steps.image.outputs.run }}
    # Biome also checks the change notes, so only the lint runs on a
    # documentation change. A failed or skipped diff runs everything.
    env:
      TESTS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its base, for the diff below.
          fetch-depth: 2
      - uses: ./.github/actions/release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
          artifact: ${{ inputs.candidate_artifact }}
      # A pull request or a push to main tests the image only when it changes
      # what the image adds around the app: Caddy, the build, the /dav proxy.
      # The e2e suite already runs under the Caddyfile's CSP (vite.config.ts).
      - id: image
        env:
          BASE: ${{ (github.event_name == 'pull_request' && 'HEAD^1') || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: |
          if [ -z "$BASE" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git cat-file -e "$BASE" 2>/dev/null || git fetch --quiet --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(Dockerfile|Caddyfile|\.dockerignore|package\.json|pnpm-(lock|workspace)\.yaml|vite\.config\.ts|playwright\.config\.ts|session/|src/dav/|tests/e2e/|\.github/workflows/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: env.TESTS == 'true'
        run: pnpm typecheck && pnpm test
      # natel-session (ADR 032), with the Go image the Dockerfile builds it in.
      - if: env.TESTS == 'true'
        run: |
          # shellcheck disable=SC2016
          image=$(sed -n 's/^FROM --platform=$BUILDPLATFORM \(golang:[^ ]*\) AS session$/\1/p' Dockerfile)
          test -n "$image"
          docker run --rm -v "$PWD/session:/src" -w /src "$image" \
            sh -c 'test -z "$(gofmt -l .)" && go vet ./... && go test ./...'
      - if: env.TESTS == 'true'
        run: pnpm build
      # The demo's CardDAV stand-in (ADR 025) never ships in the image's build.
      - if: env.TESTS == 'true'
        run: |
          if grep -rq demo.natel.invalid dist; then
            echo "The demo's CardDAV stand-in is in the normal build" >&2
            exit 1
          fi
      # Nor does the demo's preview image, which names the demo's address.
      - if: env.TESTS == 'true'
        run: |
          if grep -rqE 'og:image|og-image\.png|github\.io' dist; then
            echo "The demo's link preview image is in the normal build" >&2
            exit 1
          fi

  e2e:
    name: e2e (${{ matrix.server }})
    needs: changes
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # The radicale job also runs the demo suite, which together take about
    # 15 minutes on GitHub's runners.
    timeout-minutes: ${{ vars.RUNNER && 45 || 25 }}
    # The compatibility matrix: the same suite against each CardDAV server.
    strategy:
      fail-fast: false
      matrix:
        server: [radicale, baikal, baikal-digest, xandikos, nextcloud]
    # Its steps are skipped rather than the job: a skipped matrix job reports
    # under its unexpanded name, not the required "e2e (radicale)". So every
    # step that needs the checkout is guarded by TESTS.
    env:
      TESTS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
          artifact: ${{ inputs.candidate_artifact }}
      - if: env.TESTS == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: env.TESTS == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: env.TESTS == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - if: env.TESTS == 'true'
        run: pip install -r tests/e2e/requirements.txt
      - if: env.TESTS == 'true'
        run: pnpm install --frozen-lockfile
      # The browsers' system packages come from the Ubuntu mirror, which now
      # and then stalls a runner for longer than the job's timeout. A stalled
      # download fails fast and is retried, and the packages are cached: apt
      # checks each cached one against the signed index before installing it.
      - if: env.TESTS == 'true'
        id: playwright
        run: |
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::Retries "5";' \
            'APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99natel-ci >/dev/null
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "key=playwright-apt-$ImageOS-$version-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "prefix=playwright-apt-$ImageOS-$version-" >> "$GITHUB_OUTPUT"
      - if: env.TESTS == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.playwright.outputs.key }}
          restore-keys: ${{ steps.playwright.outputs.prefix }}
      - if: env.TESTS == 'true'
        run: |
          mkdir -p ~/apt-archives
          sudo find ~/apt-archives -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          pnpm exec playwright install --with-deps chromium firefox webkit
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
      - if: env.TESTS == 'true'
        run: pnpm e2e
        env:
          E2E_SERVER: ${{ matrix.server }}
      # The demo build (ADR 025) needs no server: once is enough.
      - if: env.TESTS == 'true' && matrix.server == 'radicale'
        run: pnpm e2e:demo
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.server }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # Build the release image only after the other checks pass.
    needs: [changes, check, e2e]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && needs.check.result == 'success'
      && (needs.e2e.result == 'success'
      || (needs.e2e.result == 'skipped' && !startsWith(github.ref, 'refs/tags/')))
      && needs.check.outputs.image == 'true' }}
    # Pinned rather than -latest: both jobs rely on the image's skopeo.
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ vars.RUNNER && 60 || 20 }}
    permissions:
      contents: read
      packages: read
    outputs:
      artifact: image-${{ github.run_attempt }}
    # A release builds what gets published: it reads no cache, since a run of
    # main can write to the ones it would read.
    env:
      RELEASE_BUILD: ${{ inputs.candidate_sha != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
          artifact: ${{ inputs.candidate_artifact }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          # A multi-platform package takes its description from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/kewindousse/natel
          flavor: latest=false
          tags: type=raw,value=${{ inputs.release_version || 'ci' }}
          labels: org.opencontainers.image.revision=${{ inputs.candidate_sha || github.sha }}
          annotations: org.opencontainers.image.revision=${{ inputs.candidate_sha || github.sha }}
      - name: Reuse an immutable image on a release retry
        if: inputs.candidate_sha != ''
        id: existing
        run: |
          set -euo pipefail
          echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          image="ghcr.io/kewindousse/natel:$VERSION"
          if skopeo inspect "docker://$image" > existing.json 2> inspect-error.txt; then
            test "$(jq -r '.Labels["org.opencontainers.image.revision"]' existing.json)" = "$REVISION"
            digest=$(jq -r '.Digest' existing.json)
            skopeo copy --all --preserve-digests "docker://ghcr.io/kewindousse/natel@$digest" oci-archive:image.tar:ci
            echo reuse=true >> "$GITHUB_OUTPUT"
          elif ! grep -qiE 'manifest unknown|name unknown' inspect-error.txt; then
            cat inspect-error.txt >&2
            exit 1
          fi
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ inputs.release_version }}
          REVISION: ${{ inputs.candidate_sha }}
      # Both platforms in one OCI archive, so the amd64 image tested below is
      # the one published. The build stage runs natively (see the Dockerfile):
      # arm64 needs no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.reuse != 'true'
        with:
          context: .
          build-args: NATEL_REVISION=${{ inputs.candidate_sha || github.sha }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=image.tar
          provenance: false
          tags: natel:ci
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          no-cache: ${{ env.RELEASE_BUILD }}
          cache-from: ${{ env.RELEASE_BUILD != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.RELEASE_BUILD != 'true' && 'type=gha,mode=max' || '' }}
      - run: >
          skopeo copy --override-os linux --override-arch amd64
          oci-archive:image.tar:ci docker-daemon:natel:ci
      # The e2e suite again, this time through the image's Caddy: its /dav
      # proxy, redirect mapping and dropped WWW-Authenticate are what users run.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ env.RELEASE_BUILD != 'true' && 'pnpm' || '' }}
          package-manager-cache: ${{ env.RELEASE_BUILD != 'true' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: ${{ env.RELEASE_BUILD != 'true' && 'pip' || '' }}
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Locked down as a cautious user would run it: no capability, no new
      # privileges, a read-only filesystem.
      - run: >
          docker run -d --name natel --network host
          --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /config
          -e CARDDAV_URL=http://127.0.0.1:5299 -e SITE_ADDRESS=:4299
          -e NATEL_UPDATE_CHECKS=false natel:ci
      - run: curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4299/
      # The image's healthcheck commands, run as Docker runs them.
      - run: >
          docker exec natel sh -c
          'wget -q -O /dev/null "http://127.0.0.1:$NATEL_HEALTH_PORT/"
          && wget -q -O /dev/null "http://$NATEL_SESSION_ADDR/healthz"'
      - run: |
          docker exec natel caddy adapt --config /etc/caddy/Caddyfile > caddy.json
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("caddy.json", "utf8"));
          assert.equal(config.admin.disabled, true);
          const listeners = Object.values(config.apps.http.servers).flatMap((server) => server.listen);
          assert.ok(listeners.includes("127.0.0.1:2021"));
          assert.ok(listeners.filter((address) => address.endsWith(":2021")).every((address) => address === "127.0.0.1:2021"));
          JS
      - run: pnpm e2e
        env:
          E2E_EXTERNAL_APP: "1"
      # Digest signs each request's method and URI, which Caddy names to
      # natel-session (ADR 055): sign-in and editing against Baïkal as it ships.
      # headers.spec.ts checks the headers Caddy sets on a DAV answer, which
      # must hold whatever headers the server adds of its own.
      - run: >
          pnpm e2e --project=desktop tests/e2e/login.spec.ts tests/e2e/contacts.spec.ts
          tests/e2e/headers.spec.ts
        env:
          E2E_EXTERNAL_APP: "1"
          E2E_SERVER: baikal-digest
      - if: failure()
        run: docker logs natel
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-image
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Hand the tested archive itself to the publish job, not a rebuild.
      - if: inputs.candidate_sha != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.run_attempt }}
          path: image.tar
          retention-days: 7
