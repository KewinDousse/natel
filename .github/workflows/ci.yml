name: CI

# Actions minutes are counted: a draft pull request runs nothing (its author
# runs the checks locally), and a push to main, whose pull request already
# passed, runs only the unit checks, and the image when it changed (against
# the previous push, so a cancelled run's changes wait for the next tag).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's merge commit and its base, for the diff below.
          fetch-depth: 2
      # A pull request or a push to main tests the image only when it changes
      # what the image adds around the app: Caddy, the build, the /dav proxy.
      # The e2e suite already runs under the Caddyfile's CSP (vite.config.ts).
      - id: image
        env:
          BASE: ${{ (github.event_name == 'pull_request' && 'HEAD^1') || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        run: |
          if [ -z "$BASE" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git cat-file -e "$BASE" 2>/dev/null || git fetch --quiet --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(Dockerfile|Caddyfile|\.dockerignore|package\.json|pnpm-(lock|workspace)\.yaml|vite\.config\.ts|playwright\.config\.ts|src/dav/|tests/e2e/|\.github/workflows/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # The demo's CardDAV stand-in (ADR 025) never ships in the image's build.
      - run: |
          if grep -rq demo.natel.invalid dist; then
            echo "The demo's CardDAV stand-in is in the normal build" >&2
            exit 1
          fi

  e2e:
    name: e2e (${{ matrix.server }})
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The compatibility matrix: the same suite against each CardDAV server.
    strategy:
      fail-fast: false
      matrix:
        server: [radicale, baikal, xandikos]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_SERVER: ${{ matrix.server }}
      # The demo build (ADR 025) needs no server: once is enough.
      - if: matrix.server == 'radicale'
        run: pnpm e2e:demo
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.server }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # A tag publishes only what passed the other jobs.
    needs: [check, e2e]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success'
      && (needs.e2e.result == 'success'
      || (needs.e2e.result == 'skipped' && !startsWith(github.ref, 'refs/tags/')))
      && needs.check.outputs.image == 'true' }}
    # Pinned rather than -latest: both jobs rely on the image's skopeo.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        env:
          # A multi-platform package takes its description from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/kewindousse/natel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Both platforms in one OCI archive, so the amd64 image tested below is
      # the one published. The build stage runs natively (see the Dockerfile):
      # arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=image.tar
          provenance: false
          tags: natel:ci
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >
          skopeo copy --override-os linux --override-arch amd64
          oci-archive:image.tar:ci docker-daemon:natel:ci
      # The e2e suite again, this time through the image's Caddy: its /dav
      # proxy, redirect mapping and dropped WWW-Authenticate are what users run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - run: pip install -r tests/e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: >
          docker run -d --name natel --network host
          -e BAIKAL_URL=http://127.0.0.1:5299 -e SITE_ADDRESS=:4299 natel:ci
      - run: curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4299/
      - run: pnpm e2e
        env:
          E2E_EXTERNAL_APP: "1"
      - if: failure()
        run: docker logs natel
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-image
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Hand the tested archive itself to the publish job, not a rebuild.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    # The only job allowed to write packages, and it runs no repository code.
    # Only this repository publishes the image; a copy of it doesn't.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'KewinDousse/natel'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: echo "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --all keeps both platforms under each tag.
      - run: |
          test -n "$TAGS"
          for tag in $TAGS; do
            skopeo copy --all oci-archive:image.tar:ci "docker://$tag"
          done
        env:
          TAGS: ${{ needs.image.outputs.tags }}

  demo:
    # The demo (ADR 025) on this repository's GitHub Pages site, at each
    # release; a pre-release (a tag with a suffix) leaves it as it is.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
      && github.repository == 'KewinDousse/natel'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time, so two tags close together land in order.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --outDir dist-demo
        env:
          VITE_DEMO: "1"
          VITE_BASE: /natel/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - id: deploy
        uses: actions/deploy-pages@v4
