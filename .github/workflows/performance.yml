name: Performance comparison

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: performance-${{ inputs.pull_request }}
  cancel-in-progress: true

jobs:
  # Runs the pull request's code, so its token can only read.
  measure:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      # The test merge commit: its first parent is main, its second the pull request.
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          # GitHub computes mergeability on request, shortly after the first read.
          for _ in 1 2 3 4 5 6; do
            known=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq '.mergeable != null')
            [ "$known" = true ] && break
            sleep 10
          done
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
            --jq 'if .state == "open" and .mergeable and .base.ref == "main" then "sha=" + .merge_commit_sha + "\nhead=" + .head.sha else error("The pull request must be open, mergeable and based on main") end' \
            >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.merge.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      # No cache: this job would save what the pull request's code left behind
      # into main's cache scope, which CI and releases read. That code can still
      # reach that scope through a post step, so dispatching is a trust decision.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r tests/e2e/requirements.txt
      # Both versions run the same benchmark: the pull request's.
      - name: Prepare main
        env:
          HEAD_SHA: ${{ steps.merge.outputs.head }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          git worktree add "$RUNNER_TEMP/main" HEAD^1
          rm -rf "$RUNNER_TEMP/main/tests/performance"
          git -C "$RUNNER_TEMP/main" checkout "$(git rev-parse HEAD)" -- \
            tests/performance tests/e2e/radicale.sh playwright.performance.config.ts
      # The Ubuntu mirror now and then stalls a runner: fail fast and retry.
      - run: |
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::Retries "5";' |
            sudo tee /etc/apt/apt.conf.d/99natel-ci >/dev/null
      # A size over its limit fails the run and still leaves its report.
      - name: Measure main
        working-directory: ${{ runner.temp }}/main
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/main.json
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.performance.config.ts --reporter=list,json || true
      - name: Measure the pull request
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/head.json
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.performance.config.ts --reporter=list,json || true
      - id: report
        run: |
          status=0
          node scripts/perf-report.mjs "$RUNNER_TEMP/main.json" "$RUNNER_TEMP/head.json" \
            "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD^2)" > "$RUNNER_TEMP/report.md" || status=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$(base64 -w0 "$RUNNER_TEMP/report.md")" >> "$GITHUB_OUTPUT"
          exit "$status"

  # Runs no repository code, on a machine the pull request's code never touched.
  comment:
    needs: measure
    if: ${{ !cancelled() && needs.measure.outputs.report != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REPORT: ${{ needs.measure.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- performance-comparison -->'
          body="$marker
          $(printf '%s' "$REPORT" | base64 -d)

          [Workflow run]($RUN_URL)"
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" -f body="$body" >/dev/null
          fi
