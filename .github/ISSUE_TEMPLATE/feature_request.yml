name: Feature request
description: Something Natel should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I've read the non-goals in the README (contacts only, no backend).
          required: true
